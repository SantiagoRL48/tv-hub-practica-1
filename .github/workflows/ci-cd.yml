name: CI/CD TV Hub

on:
  push:
    branches: [practica-integradora-3]
  pull_request:
    branches: [practica-integradora-3]
  workflow_dispatch:

# Evita que dos despliegues de la misma rama se ejecuten al mismo tiempo.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI - pruebas y build
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias (npm ci)
        run: npm ci

      - name: Ejecutar pruebas (Jest + mongodb-memory-server)
        run: npm test

      - name: Compilar TypeScript y copiar la interfaz
        run: npm run build

  deploy:
    name: CD - solicitar despliegue en Render
    needs: ci
    # Solo despliega con un push a la rama de producción y únicamente si el job ci terminó con éxito.
    if: github.event_name == 'push' && github.ref == 'refs/heads/practica-integradora-3'
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al Deploy Hook de Render con el commit validado
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Falta el secret RENDER_DEPLOY_HOOK_URL en el repositorio"
            exit 1
          fi
          # ref=<sha> pide a Render desplegar exactamente el commit que pasó CI (trazabilidad).
          status=$(curl -sS -o response.json -w '%{http_code}' -X POST "${RENDER_DEPLOY_HOOK_URL}&ref=${GITHUB_SHA}")
          echo "Render respondió HTTP ${status}"
          if [ "$status" != "200" ] && [ "$status" != "202" ]; then
            exit 1
          fi
          deploy_id=$(node -e "try{console.log(require('./response.json').deploy?.id ?? 'en cola')}catch{console.log('sin id')}")
          {
            echo "### Despliegue solicitado a Render"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Deploy de Render: \`${deploy_id}\`"
          } >> "$GITHUB_STEP_SUMMARY"
